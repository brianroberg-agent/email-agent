[project]
name = "email-agent-server"
version = "2.0.0"
description = "A privacy-focused FastAPI server that wraps the Gmail API for use with AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-subtests>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
